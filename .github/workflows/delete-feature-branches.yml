name: Delete merged feature/hotfix branches

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    # Only act on PRs that were actually merged (not merely closed)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Delete feature/* or hotfix/* head branch after merge
        # Spares develop, main, and any other branch type by design
        if: >-
          startsWith(github.event.pull_request.head.ref, 'feature/') ||
          startsWith(github.event.pull_request.head.ref, 'hotfix/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          echo "Deleting merged head branch: $BRANCH"
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$BRANCH"
